name: Static Analysis (All Components)

on:
  push:
    branches: [ main, develop, master ]
    paths:
      - 'PrivAlert/backend/**'
      - 'PrivAlert/fastapi-backend/**'
      - 'PrivAlert/frontend/**'
      - '.github/workflows/static-analysis.yml'
  pull_request:
    branches: [ main, develop, master ]
    paths:
      - 'PrivAlert/backend/**'
      - 'PrivAlert/fastapi-backend/**'
      - 'PrivAlert/frontend/**'
      - '.github/workflows/static-analysis.yml'

jobs:
  # ========== Flask Backend 정적 분석 ==========
  flask-backend:
    name: Flask Backend Analysis
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: PrivAlert/backend
    
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Flake8 (Code Quality)
      id: flake8
      continue-on-error: true
      run: |
        echo "::group::Flake8 Code Quality Check"
        flake8 . --config=.flake8 --format=default --statistics --count
        echo "::endgroup::"
    
    - name: Run Bandit (Security Scan)
      id: bandit
      continue-on-error: true
      run: |
        echo "::group::Bandit Security Scan"
        bandit -r . --exclude ./venv,./.venv,./__pycache__,./.pytest_cache -s B104 -f json -o bandit-report.json || true
        bandit -r . --exclude ./venv,./.venv,./__pycache__,./.pytest_cache -s B104 -f screen || true
        echo "::endgroup::"
    
    - name: Run Safety (Dependency Vulnerability Check)
      id: safety
      continue-on-error: true
      run: |
        echo "::group::Safety Dependency Check"
        pip install --upgrade "safety>=2.3.5"
        export PYTHONIOENCODING=utf-8
        python -X utf8 -m safety scan --file requirements.txt --full-report --continue-on-error --json --output safety-report.json || true
        python -X utf8 -m safety scan --file requirements.txt --full-report --continue-on-error || true
        echo "::endgroup::"
    
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: flask-backend-reports
        path: |
          PrivAlert/backend/bandit-report.json
          PrivAlert/backend/safety-report.json
        retention-days: 30

  # ========== FastAPI Backend 정적 분석 ==========
  fastapi-backend:
    name: FastAPI Backend Analysis
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: PrivAlert/fastapi-backend
    
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Flake8 (Code Quality)
      id: flake8
      continue-on-error: true
      run: |
        echo "::group::Flake8 Code Quality Check"
        flake8 . --config=.flake8 --format=default --statistics --count
        echo "::endgroup::"
    
    - name: Run Bandit (Security Scan)
      id: bandit
      continue-on-error: true
      run: |
        echo "::group::Bandit Security Scan"
        bandit -r . --exclude ./venv,./.venv,./__pycache__,./.pytest_cache -s B104 -f json -o bandit-report.json || true
        bandit -r . --exclude ./venv,./.venv,./__pycache__,./.pytest_cache -s B104 -f screen || true
        echo "::endgroup::"
    
    - name: Run Safety (Dependency Vulnerability Check)
      id: safety
      continue-on-error: true
      run: |
        echo "::group::Safety Dependency Check"
        pip install --upgrade "safety>=2.3.5"
        export PYTHONIOENCODING=utf-8
        # extras 구문이 포함된 requirements.txt는 Safety가 파싱하지 못하므로
        # extras를 제거한 requirements-safety.txt 사용 (없으면 requirements.txt 사용)
        # pyproject.toml 자동 감지를 방지하기 위해 임시로 이름 변경
        if [ -f "pyproject.toml" ]; then
          mv pyproject.toml pyproject.toml.bak
        fi
        if [ -f "requirements-safety.txt" ]; then
          SAFETY_FILE="requirements-safety.txt"
        else
          SAFETY_FILE="requirements.txt"
        fi
        python -X utf8 -m safety scan --file "$SAFETY_FILE" --full-report --continue-on-error --no-api --json --output safety-report.json || true
        python -X utf8 -m safety scan --file "$SAFETY_FILE" --full-report --continue-on-error --no-api || true
        # pyproject.toml 복원
        if [ -f "pyproject.toml.bak" ]; then
          mv pyproject.toml.bak pyproject.toml
        fi
        echo "::endgroup::"
    
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fastapi-backend-reports
        path: |
          PrivAlert/fastapi-backend/bandit-report.json
          PrivAlert/fastapi-backend/safety-report.json
        retention-days: 30

  # ========== Frontend 정적 분석 ==========
  frontend:
    name: Frontend Analysis
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: PrivAlert/frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: PrivAlert/frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: TypeScript Type Check
      id: type-check
      continue-on-error: true
      run: |
        echo "::group::TypeScript Type Check"
        npm run type-check
        echo "::endgroup::"
    
    - name: ESLint Code Quality Check
      id: eslint
      continue-on-error: true
      run: |
        echo "::group::ESLint Code Quality Check"
        npm run lint:warn
        echo "::endgroup::"
    
    - name: npm audit Security Check
      id: audit
      continue-on-error: true
      run: |
        echo "::group::npm audit Security Check"
        npm run audit
        echo "::endgroup::"
    
    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-audit-report
        path: PrivAlert/frontend/npm-audit-report.json
        retention-days: 30
      continue-on-error: true

  # ========== 최종 결과 확인 ==========
  check-results:
    name: Check All Results
    runs-on: ubuntu-latest
    needs: [flask-backend, fastapi-backend, frontend]
    if: always()
    
    steps:
    - name: Check job outcomes
      run: |
        if [ "${{ needs.flask-backend.result }}" == "failure" ] || \
           [ "${{ needs.fastapi-backend.result }}" == "failure" ] || \
           [ "${{ needs.frontend.result }}" == "failure" ]; then
          echo "::error::One or more static analysis jobs failed. Please review the reports."
          exit 1
        fi
        echo "✅ All static analysis checks passed!"

