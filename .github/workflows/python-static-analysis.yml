name: Python Static Analysis

on:
  push:
    branches: [ main, develop, master ]
    paths:
      - 'PrivAlert/backend/**/*.py'
      - 'PrivAlert/backend/requirements.txt'
      - '.github/workflows/python-static-analysis.yml'
  pull_request:
    branches: [ main, develop, master ]
    paths:
      - 'PrivAlert/backend/**/*.py'
      - 'PrivAlert/backend/requirements.txt'
      - '.github/workflows/python-static-analysis.yml'

jobs:
  static-analysis:
    name: Code Quality & Security Check
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: PrivAlert/backend
    
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Flake8 (Code Quality)
      id: flake8
      continue-on-error: true
      run: |
        echo "::group::Flake8 Code Quality Check"
        flake8 . --config=.flake8 --format=default --statistics --count
        echo "::endgroup::"
      env:
        FLAKE8_EXIT_ZERO: "false"
    
    - name: Run Bandit (Security Scan)
      id: bandit
      continue-on-error: true
      run: |
        echo "::group::Bandit Security Scan"
        # pyproject.toml을 자동으로 인식 (인코딩 문제 방지를 위해 .bandit 파일 삭제됨)
        # venv 디렉토리 명시적으로 제외
        # B104 (hardcoded_bind_all_interfaces) skip - 개발 환경에서 0.0.0.0 사용 허용
        bandit -r . --exclude ./venv,./.venv,./__pycache__,./.pytest_cache -s B104 -f json -o bandit-report.json || true
        bandit -r . --exclude ./venv,./.venv,./__pycache__,./.pytest_cache -s B104 -f screen || true
        echo "::endgroup::"
    
    - name: Upload Bandit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: PrivAlert/backend/bandit-report.json
        retention-days: 30
    
    - name: Run Safety (Dependency Vulnerability Check)
      id: safety
      continue-on-error: true
      run: |
        echo "::group::Safety Dependency Check"
        # Safety 최신 안정 버전 설치 (typer 호환성 문제 해결)
        pip install --upgrade "safety>=2.3.5"
        # Safety의 새로운 scan 명령 사용 (check는 deprecated)
        # UTF-8 인코딩 강제 설정 (cp949 오류 방지)
        # 비대화형 모드로 실행
        # requirements.txt만 스캔 (pyproject.toml 자동 감지 방지)
        export PYTHONIOENCODING=utf-8
        python -X utf8 -m safety scan --file requirements.txt --full-report --continue-on-error --json --output safety-report.json || true
        python -X utf8 -m safety scan --file requirements.txt --full-report --continue-on-error || true
        echo "::endgroup::"
    
    - name: Upload Safety report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: safety-report
        path: PrivAlert/backend/safety-report.json
        retention-days: 30
    
    - name: Check results
      if: steps.flake8.outcome == 'failure' || steps.bandit.outcome == 'failure' || steps.safety.outcome == 'failure'
      run: |
        echo "::error::Static analysis found issues. Please review the reports."
        exit 1

