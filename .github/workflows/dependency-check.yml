# 의존성 업데이트 확인 워크플로우
# 이 워크플로우는 프로젝트의 의존성 패키지가 업데이트되었는지, 취약점이 있는지 확인합니다.
name: Dependency Check

# 워크플로우 실행 조건
on:
  # 수동 실행 가능 (GitHub Actions 탭에서 직접 실행)
  workflow_dispatch:

jobs:
  # 의존성 확인 작업
  check-dependencies:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    
    steps:
    # 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v4
    
    # ========== Python 의존성 확인 ==========
    # Python 환경 설정
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # 백엔드에서 사용하는 Python 버전
    
    # 오래된 Python 패키지 확인 (pip list로 확인)
    - name: Check for outdated Python packages
      working-directory: ./backend
      run: |
        pip install --upgrade pip || echo "pip 업그레이드 생략"
        pip install -r requirements.txt || echo "의존성 설치 실패"
        pip list --outdated || echo "Python 의존성 확인 완료"
      continue-on-error: true
    
    # ========== npm 의존성 확인 ==========
    - name: Check npm dependencies
      uses: actions/setup-node@v6
      with:
        node-version: '20'  # 프론트엔드에서 사용하는 Node.js 버전
    
    # 오래된 npm 패키지 확인 (업데이트 가능한 패키지 목록 출력)
    - name: Check for outdated npm packages
      working-directory: ./frontend
      run: |
        npm outdated || echo "의존성 확인 완료"
      continue-on-error: true
    
    # npm 패키지 보안 취약점 확인 (중간 이상 심각도)
    - name: Check for security vulnerabilities (npm)
      working-directory: ./frontend
      run: |
        npm audit --audit-level=moderate || echo "보안 취약점 확인 완료"
      continue-on-error: true
    
    # ========== Python 패키지 보안 취약점 확인 ==========
    - name: Check for security vulnerabilities (Python)
      working-directory: ./backend
      run: |
        pip install safety || echo "safety 설치 실패"  # safety: Python 패키지 취약점 스캔 도구
        safety check --file requirements.txt || echo "Python 취약점 확인 완료"
      continue-on-error: true

