# Nginx 보안 설정 파일
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 보안: .well-known 경로는 허용 (SSL 인증서, Chrome DevTools 등 표준 경로)
    # 파일이 없어도 조용히 처리 (204 No Content 반환)
    location ~ /\.well-known {
        allow all;
        # 로그 완전히 차단
        access_log off;
        log_not_found off;
        # 파일이 없으면 204 반환 (조용한 응답)
        return 204;
    }

    # 보안: 숨김 파일 접근 차단 (.well-known 제외)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 보안: 민감한 파일 접근 차단
    location ~* \.(env|log|sql|md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 보안 헤더 설정
    # 클릭재킹 방지 (DENY로 모든 프레임 차단)
    add_header X-Frame-Options "DENY" always;
    # MIME-sniffing 방지
    add_header X-Content-Type-Options "nosniff" always;
    # XSS 방지
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer 정책
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 브라우저 기능 제한 (Permissions-Policy)
    # speaker는 더 이상 표준이 아니므로 제거
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    # Content Security Policy 
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; img-src 'self' data: blob: http://localhost:5000 http://localhost:8000 https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:5000 http://localhost:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
    # HSTS (HTTPS 사용 시 활성화, 주석 해제)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 정적 파일 서빙
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 보안: 캐시 설정
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 보안: 압축 설정
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # 보안: 파일 업로드 크기 제한
    client_max_body_size 100M;

    # 보안: 숨김 버전 정보
    server_tokens off;

    # 에러 페이지
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

