version: '3.8'

services:
  # MySQL 데이터베이스 서비스
  mysql:
    image: mysql:8.0
    container_name: privalert_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-privalert}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - privalert_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Flask 애플리케이션 서비스
  flask:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    container_name: privalert_flask
    restart: unless-stopped
    environment:
      # Flask 설정
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change-in-production}
      PORT: ${PORT:-5000}
      
      # 데이터베이스 설정
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-privalert}
      DB_SSL_MODE: ${DB_SSL_MODE:-DISABLED}
      
      # 비밀번호 보안
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-change-in-production}
      
      # 관리자 계정
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      
      # CORS 설정
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # 로깅
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # 파일 업로드
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-10}
      
      # 기타 API 키
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GOOGLE_CLOUD_CREDENTIALS_JSON: ${GOOGLE_CLOUD_CREDENTIALS_JSON:-}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ../backend/static:/app/static
      - ../backend/data:/app/data
      - ../backend/models:/app/models
    networks:
      - privalert_network
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "
        echo '데이터베이스 연결 대기 중...' &&
        sleep 10 &&
        echo '데이터베이스 초기화 시작...' &&
        python init_db.py &&
        echo 'Flask 서버 시작...' &&
        python wsgi.py
      "

  # React 프론트엔드 서비스
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
    container_name: privalert_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - privalert_network
    depends_on:
      - flask

  # phpMyAdmin - 데이터베이스 관리용
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: privalert_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-app_user}
      PMA_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "8080:80"
    networks:
      - privalert_network
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local

networks:
  privalert_network:
    driver: bridge

