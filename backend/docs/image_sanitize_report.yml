tags:
  - Image Sanitize
summary: 이미지 sanitize 리포트 반환
description: 이미지 파일에서 EXIF, GPS 등 민감한 메타데이터를 제거하고 sanitize 결과 리포트를 반환합니다.
consumes:
  - multipart/form-data
parameters:
  - name: file
    in: formData
    type: file
    required: true
    description: 업로드할 이미지 파일
  - name: target_format
    in: formData
    type: string
    enum: [jpg, png, webp, heic]
    description: 변환할 대상 포맷
  - name: keep_icc
    in: formData
    type: boolean
    description: ICC 프로파일 유지 여부
responses:
  200:
    description: Sanitize 결과 보고서
    schema:
      type: object
      properties:
        exif_removed:
          type: boolean
          example: true
        original_format:
          type: string
          example: "jpeg"
        new_format:
          type: string
          example: "jpeg"
        icc_kept:
          type: boolean
          example: true
  400:
    description: 잘못된 요청
    schema:
      type: object
      properties:
        error:
          type: string
          example: "file is required"
