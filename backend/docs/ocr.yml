tags:
  - OCR
summary: 텍스트 추출 (OCR)
description: 업로드된 이미지에서 텍스트를 추출하고, 결과 텍스트와 요약 정보를 반환합니다. OCR 결과 JSON은 내부 저장(`data/results/ocr`)만 수행되며, 외부로는 공개되지 않습니다.
consumes:
  - multipart/form-data
parameters:
  - name: file
    in: formData
    type: file
    required: true
    description: 텍스트가 포함된 이미지 파일 (jpg, png 등)
responses:
  200:
    description: OCR 성공
    schema:
      type: object
      properties:
        success: { type: boolean, example: true }
        text: { type: string, example: "안녕하세요, 이것은 테스트입니다." }
        char_count: { type: integer, example: 15 }
        line_count: { type: integer, example: 2 }
  400:
    description: 잘못된 요청 (파일 없음/파일명 없음)
  404:
    description: 텍스트를 감지하지 못한 경우
  500:
    description: 서버 오류
