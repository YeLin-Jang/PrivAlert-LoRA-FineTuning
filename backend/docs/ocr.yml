tags:
  - OCR
summary: 텍스트 추출 (OCR)
description: 업로드된 이미지에서 텍스트를 추출하고, 결과 텍스트와 요약 정보를 반환합니다. 텍스트가 감지되지 않아도 200 OK를 반환합니다. OCR 결과 JSON은 내부 저장(`data/results/ocr`)만 수행되며, 외부로는 공개되지 않습니다.
consumes:
  - multipart/form-data
parameters:
  - name: file
    in: formData
    type: file
    required: true
    description: 텍스트가 포함된 이미지 파일 (jpg, png 등)
responses:
  200:
    description: OCR 처리 완료 (텍스트 감지 여부와 관계없이)
    schema:
      type: object
      properties:
        success: { type: boolean, example: true }
        count: { type: integer, example: 1, description: "감지된 텍스트 개수 (0 또는 1)" }
        text: { type: string, example: "안녕하세요, 이것은 테스트입니다." }
        char_count: { type: integer, example: 15 }
        line_count: { type: integer, example: 2 }
        message: { type: string, example: "텍스트가 감지되었습니다 (15자)" }
        file_url: { type: string, example: "/static/temp/ocr_result_20240101_120000_abc123.json", description: "OCR 결과 JSON 파일 URL" }
    examples:
      text_detected:
        summary: 텍스트가 감지된 경우
        value:
          success: true
          count: 1
          text: "안녕하세요, 이것은 테스트입니다."
          char_count: 15
          line_count: 2
          message: "텍스트가 감지되었습니다 (15자)"
          file_url: "/static/temp/ocr_result_20240101_120000_abc123.json"
      no_text:
        summary: 텍스트가 감지되지 않은 경우
        value:
          success: true
          count: 0
          text: ""
          char_count: 0
          line_count: 0
          message: "텍스트가 발견되지 않았습니다"
  400:
    description: 잘못된 요청 (파일 없음/파일명 없음)
  500:
    description: 서버 오류
