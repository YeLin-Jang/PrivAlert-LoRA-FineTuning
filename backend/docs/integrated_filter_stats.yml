tags:
  - name: Integrated Filter
    description: 통합 필터링 API

paths:
  /api/v1/filter/statistics:
    get:
      tags:
        - Integrated Filter
      summary: 각 필터별 통계 정보 조회
      description: |
        각 필터링 모델별 통계 정보를 조회합니다.
      produces:
        - application/json
      responses:
        200:
          description: 통계 조회 성공
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              statistics:
                type: object
                properties:
                  religious:
                    type: object
                    properties:
                      christianity:
                        type: object
                        properties:
                          keywords:
                            type: integer
                            example: 45
                          patterns:
                            type: integer
                            example: 8
                          total:
                            type: integer
                            example: 53
                      islam:
                        type: object
                        properties:
                          keywords:
                            type: integer
                            example: 32
                          patterns:
                            type: integer
                            example: 6
                          total:
                            type: integer
                            example: 38
                  klie:
                    type: object
                    properties:
                      total_patterns:
                        type: integer
                        example: 150
                  personal_info:
                    type: object
                    properties:
                      total_patterns:
                        type: integer
                        example: 200
        500:
          description: 서버 내부 오류
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "서버 내부 오류가 발생했습니다"
              code:
                type: integer
                example: 500
