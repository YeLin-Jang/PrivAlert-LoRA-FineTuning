tags:
  - name: Integrated Filter
    description: 통합 필터링 API

paths:
  /api/v1/filter/filter:
    post:
      tags:
        - Integrated Filter
      summary: 텍스트를 여러 필터링 모델을 통해 처리
      description: |
        입력된 텍스트를 종교, KLIE 등 여러 필터링 모델을 통해 처리합니다.
        각 필터별로 민감 정보를 감지하고 마스킹합니다.
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          description: 필터링할 텍스트와 옵션
          required: true
          schema:
            type: object
            required:
              - text
            properties:
              text:
                type: string
                description: 필터링할 텍스트
                example: "예수 그리스도는 하나님의 아들입니다. 개인정보는 123-456-7890입니다."
                maxLength: 10000
              mask_char:
                type: string
                description: 마스킹에 사용할 문자
                default: "*"
                example: "*"
                maxLength: 1
              filters:
                type: array
                description: "적용할 필터 목록 (선택사항, 기본값: 모든 필터)"
                items:
                  type: string
                  enum: [religious, klie, personal_info]
                example: ["religious", "klie"]
      responses:
        200:
          description: 필터링 성공
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              original_text:
                type: string
                example: "예수 그리스도는 하나님의 아들입니다. 개인정보는 123-456-7890입니다."
              filtered_text:
                type: string
                example: "*** ******는 ******의 아들입니다. 개인정보는 ***-***-****입니다."
              filter_results:
                type: object
                properties:
                  religious:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      detected_words:
                        type: array
                        items:
                          type: object
                          properties:
                            word:
                              type: string
                              example: "예수"
                            religion:
                              type: string
                              example: "christianity"
                            pattern_type:
                              type: string
                              example: "keyword"
                      statistics:
                        type: object
                        properties:
                          christianity:
                            type: integer
                            example: 2
                          total_detected:
                            type: integer
                            example: 2
                  klie:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      detected_words:
                        type: array
                      statistics:
                        type: object
              overall_statistics:
                type: object
                properties:
                  total_detected:
                    type: integer
                    example: 5
                  total_words:
                    type: integer
                    example: 10
                  detection_rate:
                    type: number
                    example: 50.0
                  applied_filters:
                    type: array
                    items:
                      type: string
                    example: ["religious", "klie"]
              has_sensitive_content:
                type: boolean
                example: true
        400:
          description: 잘못된 요청
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "텍스트가 제공되지 않았습니다"
              code:
                type: integer
                example: 400
        500:
          description: 서버 내부 오류
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "서버 내부 오류가 발생했습니다"
              code:
                type: integer
                example: 500
