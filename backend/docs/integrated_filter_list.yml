tags:
  - name: Integrated Filter
    description: 통합 필터링 API

paths:
  /api/v1/filter/filters:
    get:
      tags:
        - Integrated Filter
      summary: 사용 가능한 필터 목록 조회
      description: |
        현재 사용 가능한 필터링 모델 목록을 조회합니다.
      produces:
        - application/json
      responses:
        200:
          description: 필터 목록 조회 성공
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              filters:
                type: array
                items:
                  type: string
                example: ["religious", "klie", "personal_info"]
        500:
          description: 서버 내부 오류
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "서버 내부 오류가 발생했습니다"
              code:
                type: integer
                example: 500
