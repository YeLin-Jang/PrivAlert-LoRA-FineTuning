tags:
  - name: Religious Filter
    description: 종교 필터링 API

paths:
  /api/v1/religious/test:
    post:
      tags:
        - Religious Filter
      summary: 종교 필터링 테스트
      description: |
        다양한 테스트 케이스를 통해 종교 필터링의 정확도를 검증합니다.
        기본 테스트 케이스:
        - "하나님 비하하는 말" (감지되어야 함)
        - "교회에 다닌다" (감지되지 않아야 함)
        - "예수 모독하는 내용" (감지되어야 함)
        - "교수님이 좋다" (감지되지 않아야 함)
        - "부처 욕하는 글" (감지되어야 함)
        - "절에 가서 참배한다" (감지되지 않아야 함)
        - "알라 비하 표현" (감지되어야 함)
        - "이슬람 문화를 배운다" (감지되지 않아야 함)
        - "종교 비하 발언" (감지되어야 함)
        - "신호등이 파란색이다" (감지되지 않아야 함)
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          description: 테스트 케이스 (선택사항)
          required: false
          schema:
            type: object
            properties:
              test_cases:
                type: array
                items:
                  type: string
                description: 커스텀 테스트 케이스 목록
                example: ["하나님 비하하는 말", "교회에 다닌다", "예수 모독하는 내용"]
      responses:
        200:
          description: 테스트 완료
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              test_results:
                type: array
                items:
                  type: object
                  properties:
                    test_case:
                      type: integer
                      example: 1
                      description: 테스트 케이스 번호
                    text:
                      type: string
                      example: "하나님 비하하는 말"
                      description: 테스트 텍스트
                    detected:
                      type: boolean
                      example: true
                      description: 민감 내용 감지 여부
                    detected_words:
                      type: array
                      items:
                        type: object
                        properties:
                          word:
                            type: string
                            example: "하나님 비하"
                          start:
                            type: integer
                            example: 0
                          end:
                            type: integer
                            example: 5
                          religion:
                            type: string
                            example: "christianity"
                          pattern_type:
                            type: string
                            example: "keyword"
                    expected:
                      type: string
                      example: "감지되어야 함"
                      description: 예상 결과
                    correct:
                      type: boolean
                      example: true
                      description: 테스트 통과 여부
              summary:
                type: object
                properties:
                  total_tests:
                    type: integer
                    example: 10
                    description: 전체 테스트 수
                  correct_tests:
                    type: integer
                    example: 10
                    description: 통과한 테스트 수
                  accuracy:
                    type: number
                    format: float
                    example: 100.0
                    description: 정확도 (%)
                  message:
                    type: string
                    example: "테스트 완료: 10/10 정확 (100.0%)"
        500:
          description: 서버 내부 오류
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "테스트 중 오류가 발생했습니다"
              code:
                type: integer
                example: 500

