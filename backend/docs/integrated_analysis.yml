tags:
  - name: Integrated Analysis
    description: 통합 분석 API

paths:
  /api/v1/analyze/analyze:
    post:
      tags:
        - Integrated Analysis
      summary: 이미지와 텍스트를 통합 분석
      description: |
        이미지에서 얼굴, 손가락을 검출하고 OCR로 텍스트를 추출한 후,
        종교 관련 민감 텍스트를 필터링합니다.
        블로그 콘텐츠의 개인정보 보호를 위한 통합 분석 기능입니다.
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - in: formData
          name: image
          type: file
          description: 분석할 이미지 파일 (여러 장 선택 가능)
          required: false
          allowEmptyValue: true
        - in: formData
          name: text
          type: string
          description: 분석할 텍스트 (이미지에서 OCR로 추출된 텍스트와 함께 분석)
          required: false
          allowEmptyValue: true
        - in: formData
          name: blur_fingers
          type: boolean
          description: "손가락 블러 처리 여부 (기본값: true)"
          required: false
          default: true
        - in: formData
          name: show_faces
          type: boolean
          description: "얼굴 상세 표시 여부 (false면 개수만 표시, 기본값: false)"
          required: false
          default: false
      responses:
        200:
          description: 분석 성공
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              face_detection:
                type: object
                properties:
                  count:
                    type: integer
                    example: 2
                  message:
                    type: string
                    example: "2개의 얼굴이 감지되었습니다"
                  faces:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        box:
                          type: object
                          properties:
                            x: {type: integer}
                            y: {type: integer}
                            w: {type: integer}
                            h: {type: integer}
                        score:
                          type: number
                  result_image_url:
                    type: string
                    example: "/static/results/face/face_20240101_120000_abc123.jpg"
              hand_detection:
                type: object
                properties:
                  count:
                    type: integer
                    example: 5
                  message:
                    type: string
                    example: "5개의 손가락이 감지되었습니다"
                  fingers:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        pos:
                          type: object
                          properties:
                            x: {type: integer}
                            y: {type: integer}
                  result_image_url:
                    type: string
                    example: "/static/results/hand/hand_20240101_120000_def456.jpg"
              text_analysis:
                type: object
                properties:
                  original_text:
                    type: string
                    example: "예수 그리스도는 하나님의 아들입니다"
                  filtered_text:
                    type: string
                    example: "*** ******는 ******의 아들입니다"
                  religious_content_detected:
                    type: boolean
                    example: true
                  detected_words:
                    type: array
                    items:
                      type: object
                      properties:
                        word:
                          type: string
                          example: "예수"
                        religion:
                          type: string
                          example: "christianity"
                        pattern_type:
                          type: string
                          example: "keyword"
                  statistics:
                    type: object
                    properties:
                      total_detected:
                        type: integer
                        example: 2
                      total_words:
                        type: integer
                        example: 5
                      detection_rate:
                        type: number
                        example: 40.0
              summary:
                type: object
                properties:
                  faces_detected:
                    type: integer
                    example: 2
                  fingers_detected:
                    type: integer
                    example: 5
                  sensitive_text_found:
                    type: boolean
                    example: true
                  religious_content_detected:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "2개의 얼굴이 탐지되었습니다; 5개의 손가락이 탐지되었습니다; 종교 관련 민감 텍스트가 발견되었습니다"
        400:
          description: 잘못된 요청
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "이미지 파일 또는 텍스트가 필요합니다"
              code:
                type: integer
                example: 400
        500:
          description: 서버 내부 오류
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "서버 내부 오류가 발생했습니다"
              code:
                type: integer
                example: 500
