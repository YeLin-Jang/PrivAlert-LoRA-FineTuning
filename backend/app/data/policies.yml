email:
  law_summary_short: "이메일 주소는 개인정보로 분류되며 동의 없는 제3자 제공은 금지됨."
  risk_scenarios: ["피싱/계정 탈취", "스팸·사기 메일 증가", "서비스 가입 도용"]
  tips: ["외부 전송 최소화", "수신자 권한·열람 범위 점검", "전송 로그 보관"]

phone:
  law_summary_short: "전화번호는 개인정보에 해당하며 무단 공개·활용은 분쟁 소지가 큼."
  risk_scenarios: ["스미싱/메신저 피싱", "사칭 전화", "스팸 마케팅 표적화"]
  tips: ["필요 시 임시/가상번호 사용", "대외 공유 금지", "연락채널 분리"]

rrn:
  law_summary_short: "주민등록번호는 원칙적 처리 금지(예외적 허용) 대상임."
  risk_scenarios: ["신원 도용", "대출/계정 개설 악용", "장기 피해"]
  tips: ["대체키 사용", "법적 근거·보관기간 명시", "접근 권한 최소화"]

account:
  law_summary_short: "계좌번호는 금융정보로 보호 대상이며 부주의 공개는 책임 소지."
  risk_scenarios: ["보이스피싱 연계", "무단 이체 시도", "사기 송금 유도"]
  tips: ["송금 정보는 안전 채널로 별도 전달", "계좌 별칭/토큰화", "거래 알림 활성화"]

passport:
  law_summary_short: "여권번호는 고유식별정보로 공개 시 도용 위험이 큼."
  risk_scenarios: ["국제 사기/티켓 발권 악용", "신원 도용", "비자/여행 서류 위조"]
  tips: ["문서 공유 전 메타/EXIF 제거", "최소 인원 공유", "보관 기간 제한"]

ip_address:
  law_summary_short: "IP는 위치/행태 추정 가능성이 있어 비식별화가 필요함."
  risk_scenarios: ["지리적 위치 추정", "서비스 공격 표적화", "추적/프로파일링"]
  tips: ["로그 공유 기간·범위 최소화", "내부 접근 통제", "익명화 절차 준수"]

school:
  law_summary_short: "학교명은 개인정보보호법상 개인 식별 정보로 분류됨."
  risk_scenarios: ["학생 신원 추적", "피싱/사칭 공격", "학원 정보 노출"]
  tips: ["학교명 대신 일반적 표현 사용", "외부 공유 시 최소 정보만 제공", "교육기관 정보 보호"]

name:
  law_summary_short: "이름은 개인정보보호법 제71조에 따라 개인 식별 정보로 분류됨."
  risk_scenarios: ["신원 도용", "피싱/사칭 공격", "개인 추적"]
  tips: ["이름 대신 일반적 표현 사용", "필요 시 성만 사용", "외부 공유 시 최소 정보만 제공"]

address:
  law_summary_short: "주소는 개인정보보호법상 개인 식별 정보로 분류됨."
  risk_scenarios: ["신원 도용 및 추적", "스토킹/괴롭힘", "불법 접근 시도"]
  tips: ["주소 대신 일반적 지역명만 사용", "상세 주소는 개인적으로 전달", "외부 공유 시 최소 정보만 제공"]

workplace:
  law_summary_short: "직장명은 개인정보보호법상 개인 식별 정보로 분류됨."
  risk_scenarios: ["직장 추적", "피싱/사칭 공격", "개인정보 유출"]
  tips: ["직장명 대신 일반적 표현 사용", "외부 공유 시 최소 정보만 제공", "회사 정보 보호"]

