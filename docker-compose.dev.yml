# 개발 환경용 Docker Compose (포트 노출 포함)
# 보안: 개발 환경에서만 사용, 프로덕션에서는 사용하지 마세요
# 사용법: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  mysql:
    ports:
      # 개발 환경에서만 외부 접근 허용 (MySQL Workbench, DBeaver 등)
      - "${MYSQL_PORT:-3306}:3306"
    # 보안: 개발 환경에서만 사용
    # 프로덕션에서는 docker-compose.yml만 사용 (포트 노출 없음)

