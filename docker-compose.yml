# Docker Compose 설정 파일
# Backend, Frontend, MySQL을 포함한 완전한 개발 환경
# 환경 변수는 프로젝트 루트의 .env 파일에서 자동 로드됩니다
# version 속성은 더 이상 사용되지 않습니다 (제거됨)

services:
  # ========== MySQL 데이터베이스 ==========
  mysql:
    image: mysql:8.0
    container_name: privalert-mysql
    restart: unless-stopped
    environment:
      # 보안: 강력한 비밀번호 사용 (환경 변수로 관리)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-privalert}
      MYSQL_USER: ${MYSQL_USER:-privalert_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 보안: SQL 모드 설정 (엄격한 검증)
      MYSQL_SQL_MODE: STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
      # 보안: 시간대 설정
      TZ: Asia/Seoul
    # 보안: 데이터베이스 포트는 Docker 내부 네트워크에서만 접근 가능
    # 개발 환경에서만 외부 접근이 필요한 경우 docker-compose.dev.yml 사용
    volumes:
      # 데이터 영속성
      - mysql_data:/var/lib/mysql
      # 초기화 스크립트
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      # 커스텀 설정 파일
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - privalert-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 보안: 메모리 및 CPU 제한
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ========== Backend 서버 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-honghhj66}/privalert-backend:1.8
    container_name: privalert-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Flask 설정
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      PORT: 5000
      
      # 데이터베이스 연결 (보안: 비밀번호 환경 변수 사용)
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-privalert_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-privalert}?charset=utf8mb4
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-privalert}
      MYSQL_USER: ${MYSQL_USER:-privalert_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      
      # API 키 (보안: 환경 변수로 관리)
      # GOOGLE_CLOUD_CREDENTIALS_JSON은 더 이상 사용하지 않음 (EasyOCR 사용)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # JWT 설정
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${FLASK_SECRET_KEY}}
      
      # CORS 설정
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      
      # 파일 업로드 제한
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-100}
      
      # 기본 관리자 계정 설정 (보안: 비밀번호는 환경 변수에서 가져옴)
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_SUPER_ADMIN_USERNAME: ${DEFAULT_SUPER_ADMIN_USERNAME:-super_admin}
      DEFAULT_SUPER_ADMIN_PASSWORD: ${DEFAULT_SUPER_ADMIN_PASSWORD}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      # 코드 마운트 (개발 환경에서 핫 리로드)
      - ./backend:/app:ro
      # 데이터 영속성 (분석 결과 저장)
      - backend_data:/app/data
      # AI 모델 (읽기 전용)
      - ./backend/models:/app/models:ro
    networks:
      - privalert-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 보안: 메모리 및 CPU 제한
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ========== FastAPI Backend 서버 ==========
  fastapi-backend:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-honghhj66}/privalert-fastapi:1.8
    container_name: privalert-fastapi-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 데이터베이스 연결 (Flask 백엔드와 같은 MySQL 사용)
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-privalert}
      MYSQL_USER: ${MYSQL_USER:-privalert_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      
      # CORS 설정
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # SMTP 설정
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-${SMTP_EMAIL:-noreply@privalert.com}}
      
      # 보안 설정
      SECRET_KEY: ${SECRET_KEY:-${FLASK_SECRET_KEY}}
      DEBUG: ${DEBUG:-false}
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    volumes:
      # 코드 마운트 (개발 환경에서 핫 리로드)
      - ./fastapi-backend:/app:ro
    networks:
      - privalert-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 보안: 메모리 및 CPU 제한
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ========== Frontend 서버 ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 빌드 시 환경 변수
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
        VITE_FASTAPI_BASE_URL: ${VITE_FASTAPI_BASE_URL:-http://localhost:8000}
    image: ${DOCKER_USERNAME:-honghhj66}/privalert-frontend:1.8
    container_name: privalert-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      # Nginx 보안 설정 파일 마운트 (빌드된 파일은 이미지 안에 포함됨)
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - privalert-network
    depends_on:
      - backend
      - fastapi-backend
    # 보안: 메모리 및 CPU 제한
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

# ========== 네트워크 설정 ==========
networks:
  privalert-network:
    driver: bridge
    # 보안: 네트워크 격리 (시큐어 코딩 가이드 준수)
    # 외부 네트워크와 격리되어 데이터베이스가 외부에 노출되지 않음
    ipam:
      config:
        - subnet: 172.28.0.0/16
    # 보안: 외부 네트워크 접근 차단
    internal: false  # 프로덕션에서는 true로 변경 권장

# ========== 볼륨 설정 ==========
volumes:
  mysql_data:
    driver: local
    # 보안: 볼륨 권한 설정 (선택사항)
  backend_data:
    driver: local

